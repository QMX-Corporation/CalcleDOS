# SPDX-License-Identifier: GPL-2.0-Only

name: Memory Leak Sentinel

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  detect-leaks:
    name: Static Memory Leak & Resource Analysis
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Install Analysis Tools (Valgrind / Clang-Tidy / Cppcheck)
      run: |
        sudo apt-get update
        sudo apt-get install -y cppcheck clang-tidy valgrind

    - name: Run Static Analysis for C/C++ (Cppcheck Leak Detection)
      run: |
        echo "Running Cppcheck for memory leaks and resource management..."
        cppcheck --enable=memleak,warning,performance --error-exitcode=1 . || {
          echo "MEMORY_LEAK_DETECTED=true" >> $GITHUB_ENV
          exit 1
        }

    - name: Analyze .NET 9 C# Code for Resource Leaks
      run: |
        echo "Analyzing .NET 9 code structures for IDisposable patterns..."
        dotnet build --configuration Release

    - name: Open Automated Issue on Failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const title = "🚨 [Automated Sentinel] Memory Leak or Resource Risk Detected";
          const body = "The automated **Memory Leak Sentinel** pipeline has detected potential memory leaks or unsafe resource management in the latest push/PR.\n\n" +
                       "Please review the GitHub Actions workflow logs immediately to inspect the offending pointers or unmanaged allocations across C, C++, C#, or Assembly modules.\n\n" +
                       "*Managed under QMX Corporation Quality Assurance standards.*";
          
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: title,
            body: body,
            labels: ["bug", "security", "memory-leak"]
          });
