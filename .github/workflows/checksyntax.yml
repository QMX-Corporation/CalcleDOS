name: Check Syntax & Style

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  detect-leaks:
    name: Static Memory Leak & Resource Analysis
    runs-on: ubuntu-latest
    if: github.actor != 'dev12124'
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

  checkpatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Perl
        run: sudo apt-get update && sudo apt-get install -y perl

      - name: Run checkpatch.pl
        run: |
          if [ -f ./checkpatch.pl ]; then
            chmod +x ./checkpatch.pl
            perl ./checkpatch.pl --no-tree --terse --file $(find . -name "*.c" -o -name "*.cpp" -o -name "*.h" -o
          -name "*.cs" -o -name "*.S") || true
          else
            echo "checkpatch.pl not found in root directory."
          }
